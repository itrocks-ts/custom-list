<!DOCTYPE html>
<html lang="en">
<head>
	<link href="../../ux-core/css/app.css" rel="stylesheet">
	<link href="../../ux-core/css/article.css" rel="stylesheet">
	<link href="../custom-list.css" rel="stylesheet">
	<meta charset="utf-8">
	<script src="../choose.js" type="module"></script>
	<title>Choose a list</title>
</head>
<body>
<!--BEGIN-->

	<!--#body:append-->
	<section class="custom-list choose-list"
		data-route="{route}" popover="manual">
		<div class="saved-lists" role="listbox" aria-label="Choose a list">
			<!--entries-->
			<a class="{?defaultClass}" href="app://(href)" target="main" data-target-history="false" role="option"
				data-key="{key}" aria-selected="{selected}" tabindex="{tabIndex}">
				<!--icon--><span class="list-icon {kind}" role="img" aria-label="{label}"></span><!--end-->
				{label}
			</a>
			<!--end-->
		</div>
		<p class="error" role="alert" hidden></p>
	</section>
	<!--#end-->

<!--END-->
</body>
</html>
